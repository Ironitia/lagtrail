[package]
name = "lagtrail"
version = "0.2.0"
edition = "2024"
authors = ["Ironitia"]
description = "Traceroute visuel continu : latence et pertes saut par saut"
license = "MIT"
homepage = "https://ironitia.com"
repository = "https://github.com/Ironitia/lagtrail"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
dns-lookup = "2"
eframe = "0.35.0"
egui_extras = "0.35"
egui_plot = "0.36"
rfd = { version = "0.18.0", default-features = false, features = ["gtk3"] }
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
] }
